# -------------------------------------------------------------
# nadamu-lifecycle configuration
# Modern Scale-to-Zero and Server Lifecycle Manager for Velocity
# -------------------------------------------------------------

# Configuration for the host-level systemd webhook bridge
bridge:
  # Internal address of the host webhook bridge from within the Podman network
  url: "http://host.containers.internal:9000"
  timeout-seconds: 5

# Fallback server used to hold players while backend servers are booting up
# Typically your lightweight NanoLimbo container
limbo-server: "limbo"

# Player notifications displayed during server startup (MiniMessage format)
messages:
  server-starting: "<gold><b>Сервер <yellow>{server}</yellow> запускается...</b></gold><newline><gray>Пожалуйста, подождите немного</gray>"
  server-ready: "<green>Сервер {server} готов! Подключение...</green>"
  server-failed: "<red>Не удалось запустить сервер {server}. Пожалуйста, обратитесь к администратору.</red>"

# Managed backend servers
# Names must match both the server name in velocity.toml and the Quadlet unit mc@<name>
servers:
  pvp:
    # How long the server can stay completely empty before being stopped (in minutes)
    idle-timeout-minutes: 10
    # Minimum time after boot before idle shutdown checks are enforced (in seconds)
    startup-grace-period-seconds: 180
    # Interval between TCP pings while checking if server is alive (in seconds)
    poll-interval-seconds: 2
    # Maximum time to wait for server to report alive before failing (in seconds)
    max-startup-wait-seconds: 120

  pillar:
    idle-timeout-minutes: 10
    startup-grace-period-seconds: 180
    poll-interval-seconds: 2
    max-startup-wait-seconds: 120

  forge:
    # Heavy modpacks take longer to boot and may need longer idle timeouts
    idle-timeout-minutes: 15
    startup-grace-period-seconds: 300
    poll-interval-seconds: 3
    max-startup-wait-seconds: 300
