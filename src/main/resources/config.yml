# -------------------------------------------------------------
# lifecycle configuration
# Modern Scale-to-Zero and Server Lifecycle Manager for Velocity
# -------------------------------------------------------------

# Configuration for the host-level systemd webhook bridge (adnanh/webhook)
bridge:
  # Internal address of the host webhook bridge from within the Podman network
  url: "http://host.containers.internal:8012"
  timeout-seconds: 5

  # Optional secret authorization token sent in the X-Bridge-Token HTTP header.
  # Leave empty if webhook token authentication is disabled.
  token: ""

  # Name of the query parameter passed to the webhook (defaults to "server")
  parameter-name: "server"

  # Systemd unit template passed in the query parameter.
  # {server} is replaced with the server key (e.g. "pvp" -> "mc@pvp").
  unit-template: "mc@{server}"

  # Webhook hook IDs matching the "id" fields in hooks.json on the host
  hooks:
    start: "start"
    stop: "stop"
    status: "status"

# Fallback server used to hold players while backend servers are booting up
# Typically your lightweight NanoLimbo container
limbo-server: "limbo"

# Default language code if player client locale is not matched
# Custom dictionaries and dialects can be placed in plugins/lifecycle/languages/ (e.g. ru.yml, en.yml, ru-ua.yml)
default-language: "ru"

# Automatic pool discovery:
# true  - lifecycle automatically manages ALL servers from velocity.toml,
#         except limbo-server and servers with enabled: false.
# false - lifecycle manages ONLY servers explicitly listed under 'servers'.
auto: true

# Default lifecycle settings applied to any managed server unless overridden
defaults:
  # How long the server can stay completely empty before being stopped (in minutes)
  idle-timeout-minutes: 10
  # Minimum time after boot before idle shutdown checks are enforced (in seconds)
  startup-grace-period-seconds: 180
  # Interval between TCP pings while checking if server is alive (in seconds)
  poll-interval-seconds: 2
  # Maximum time to wait for server to report alive before failing (in seconds)
  max-startup-wait-seconds: 120

# Server-specific overrides or whitelist (depending on 'auto' setting above)
servers:
  # Example 1: In auto mode, exclude lobby from Scale-to-Zero so it runs 24/7
  # lobby:
  #   enabled: false

  # Example 2: Heavy modpack with longer boot time and custom grace period
  forge:
    idle-timeout-minutes: 15
    startup-grace-period-seconds: 300
    poll-interval-seconds: 3
    max-startup-wait-seconds: 300

  # Example 3: Custom unit name override if it doesn't match unit-template
  # legacy:
  #   unit: "minecraft-legacy.service"
